# Analyse automatique SonarCloud.
# S8541 (--no-build omis) est un choix documenté : structured-data-models
# n'existe que sur GitHub et doit être buildée. Les workflows/Dockerfile sont
# déjà couverts par actionlint, zizmor et Trivy config.
sonar.exclusions=.github/workflows/**,Dockerfile,Dockerfile.base
