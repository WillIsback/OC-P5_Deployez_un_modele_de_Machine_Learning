# Workflow : Test d'installation (parcours évaluateur)
# Rejoue tels quels, sur une VM vierge, les deux blocs « Quickstart » du README :
#   user : `curl … | bash` (image Docker, sans clone)
#   dev  : `git clone … && scripts/quickstart.sh --source` (build local)
# Configuration, données, Docker Compose, API et vérification inclus.
# scripts/quickstart_test.sh n'ajoute aucune commande : la doc est le test.
name: ci-install

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "README.md"
      - "app/**"
      - "docker-compose.yml"
      - "docker-compose.override.yml"
      - "grafana/**"
      - "models/**"
      - "Dockerfile"
      - "Dockerfile.base"
      - ".example.env"
      - "pyproject.toml"
      - "uv.lock"
      - "scripts/quickstart.sh"
      - "scripts/quickstart_test.sh"
      - ".github/workflows/ci-install.yml"
  push:
    branches: [main]
  schedule:
    # Hebdomadaire : détecte une casse venue de l'extérieur (image de base,
    # source du dataset, dépendances) même sans commit.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: install-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci-install:
    name: ci-install (${{ matrix.path }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        path: [user, dev]

    steps:
      # Clone vierge : pas de cache, pas de credentials persistés, comme un évaluateur.
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Dépendances modifiées (pyproject.toml, uv.lock, Dockerfile.base) : l'image
      # de base publiée (…:base) ne les contient pas encore, base-image.yml ne la
      # republie qu'après le merge. On la construit alors depuis ce checkout ; les
      # deux parcours la reçoivent via P5_BASE_IMAGE (build-arg BASE_IMAGE).
      - name: Image de base locale (dépendances modifiées)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_REF" 2>/dev/null || true
          if ! git cat-file -e "$BASE_REF^{commit}" 2>/dev/null \
            || git diff --name-only "$BASE_REF" HEAD | grep -qE '^(pyproject\.toml|uv\.lock|Dockerfile\.base)$'; then
            docker build -f Dockerfile.base -t p5-base:ci .
            echo "P5_BASE_IMAGE=p5-base:ci" >> "$GITHUB_ENV"
          else
            echo "Dépendances inchangées : image de base publiée."
          fi

      # Parcours utilisateur sur une PR ou un push : l'image publiée (latest) ne
      # contient pas encore le code testé, on la construit donc depuis ce checkout.
      # Le cron et le dispatch testent l'image réellement publiée sur GHCR.
      - name: Image locale (parcours utilisateur)
        if: matrix.path == 'user' && (github.event_name == 'pull_request' || github.event_name == 'push')
        run: |
          docker build ${P5_BASE_IMAGE:+--build-arg "BASE_IMAGE=$P5_BASE_IMAGE"} -t p5-energy:ci .
          {
            echo "P5_IMAGE=p5-energy:ci"
            echo "P5_PULL=0"
          } >> "$GITHUB_ENV"

      # Le `git clone` (dev) ou les fichiers bruts (user) du README sont redirigés
      # vers ce checkout (code de la PR) ; l'URL du README est tout de même vérifiée.
      - name: Quickstart du README (${{ matrix.path }})
        env:
          QUICKSTART_CLONE_FROM: ${{ github.workspace }}
          QUICKSTART_KEEP: "1"
          QUICKSTART_PATH: ${{ matrix.path }}
        run: scripts/quickstart_test.sh "$QUICKSTART_PATH" README.md "$RUNNER_TEMP/quickstart"

      - name: Journaux des conteneurs (en cas d'échec)
        if: failure()
        working-directory: ${{ runner.temp }}/quickstart
        run: |
          cd "$(find . -maxdepth 2 -name docker-compose.yml -printf '%h' -quit)" \
            && docker compose --profile '*' logs --no-color --tail=200 || true
