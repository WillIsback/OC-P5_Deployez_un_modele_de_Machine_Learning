# Workflow : Release (CD)
# Déclenché sur push dans main ou manuellement (workflow_dispatch)
# Applique R7/R8/R9 : gates CD, bump semver, release, tag, image Docker
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Type de bump (auto = détection automatique)"
        type: choice
        options: [auto, patch, minor, major, none]
        default: auto
      dry_run:
        description: "Mode dry-run (aucune publication réelle)"
        type: boolean
        default: true

concurrency:
  group: release-main
  cancel-in-progress: false  # sérialisation stricte

permissions:
  contents: read
  packages: read

jobs:
  detect:
    name: Détection et calcul de version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.calc.outputs.version || steps.skip-output.outputs.version || 'v0.0.0' }}
      bump: ${{ steps.calc.outputs.bump || steps.skip-output.outputs.bump || 'none' }}
      deps_changed: ${{ steps.deps.outputs.changed || 'false' }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Détecter les changements de dépendances
        id: deps
        shell: bash
        run: |
          set -euo pipefail
          CHANGED=false
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            AFTER="${{ github.sha }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              RANGE="HEAD~1..HEAD"
            else
              RANGE="$BEFORE..$AFTER"
            fi
            if git diff --name-only "$RANGE" 2>/dev/null | grep -qE '^(pyproject\.toml|uv\.lock|Dockerfile\.base)$'; then
              CHANGED=true
            fi
          fi
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Vérifier [skip release]
        id: check
        shell: bash
        run: |
          set -euo pipefail
          echo "skip=false" >> $GITHUB_OUTPUT
          echo "has_commits=true" >> $GITHUB_OUTPUT

          HEAD_MSG=$(git log -1 --format=%s)
          if echo "$HEAD_MSG" | grep -qiE '\[skip release\]'; then
            echo "🔇 Commit marqué [skip release] — sortie silencieuse."
            echo "skip=true" >> $GITHUB_OUTPUT
          fi

          # Vérifier s'il y a des commits depuis le dernier tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "📦 Aucun tag existant. Première release détectée."
          else
            COMMITS_SINCE=$(git rev-list "$LAST_TAG..HEAD" --count 2>/dev/null || echo "0")
            echo "Nb de commits depuis $LAST_TAG : $COMMITS_SINCE"
            if [ "$COMMITS_SINCE" -eq 0 ]; then
              echo "ℹ️  Aucun commit éligible depuis le dernier tag."
              echo "has_commits=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Calcul de la version
        id: calc
        if: steps.check.outputs.skip != 'true' && steps.check.outputs.has_commits != 'false'
        shell: bash
        run: |
          set -euo pipefail

          # Dernier tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Dernier tag : $LAST_TAG"

          # Extraire les composants
          MAJOR=$(echo "$LAST_TAG" | sed -n 's/^v\([0-9]*\)\.[0-9]*\.[0-9]*/\1/p')
          MINOR=$(echo "$LAST_TAG" | sed -n 's/^v[0-9]*\.\([0-9]*\)\.[0-9]*/\1/p')
          PATCH=$(echo "$LAST_TAG" | sed -n 's/^v[0-9]*\.[0-9]*\.\([0-9]*\)/\1/p')
          : "${MAJOR:=0}" "${MINOR:=0}" "${PATCH:=0}"
          echo "Composants actuels : $MAJOR.$MINOR.$PATCH"

          # Déterminer le bump
          if [ "${{ inputs.bump }}" != "" ] && [ "${{ inputs.bump }}" != "auto" ]; then
            BUMP="${{ inputs.bump }}"
            echo "ℹ️  Bump forcé par workflow_dispatch : $BUMP"
          else
            # Seuls feat / fix / perf (ou breaking change) déclenchent une release.
            # docs, chore, ci, build, test, style, refactor sont ignorés.
            BUMP="none"
            echo "Analyse des commits depuis $LAST_TAG..."

            while IFS= read -r COMMIT; do
              [ -z "$COMMIT" ] && continue
              if echo "$COMMIT" | grep -qE '^[a-zA-Z]+(\(.+\))?!:'; then
                BUMP="major"
                echo "   🔴 Breaking change → major : $COMMIT"
              elif echo "$COMMIT" | grep -qE '^feat(\(.+\))?!?:' && [ "$BUMP" != "major" ]; then
                BUMP="minor"
                echo "   🟢 feat → minor : $COMMIT"
              elif echo "$COMMIT" | grep -qE '^(fix|perf)(\(.+\))?!?:' && [ "$BUMP" = "none" ]; then
                BUMP="patch"
                echo "   🔵 fix/perf → patch : $COMMIT"
              fi
            done < <(git log --format=%s "$LAST_TAG..HEAD" 2>/dev/null || true)

            # Q7 : max des bumps — déjà implémenté par la boucle (major > minor > patch)
            echo "Bump calculé : $BUMP"
          fi

          if [ "$BUMP" = "none" ] || [ -z "$BUMP" ]; then
            echo "ℹ️  Aucun commit éligible (feat/fix/perf) — aucune release ne sera publiée."
            echo "version=skipped" >> "$GITHUB_OUTPUT"
            echo "bump=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Appliquer le bump
          case "$BUMP" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          VERSION="v$MAJOR.$MINOR.$PATCH"
          echo "Version calculée : $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "bump=$BUMP" >> $GITHUB_OUTPUT

      - name: Skip si aucune release nécessaire
        id: skip-output
        if: steps.check.outputs.skip == 'true' || steps.check.outputs.has_commits == 'false'
        shell: bash
        run: |
          echo "✅ Rien à publier — sortie normale."
          echo "version=skipped" >> $GITHUB_OUTPUT
          echo "bump=none" >> $GITHUB_OUTPUT

  # Évite la course base-image/release : si le push a modifié les dépendances,
  # base-image.yml tourne en parallèle ; on attend sa fin avant de construire
  # l'image applicative (sinon le build part d'une :base obsolète).
  wait-base-image:
    name: Attente de l'image de base
    needs: [detect]
    if: needs.detect.outputs.version != 'skipped' && needs.detect.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read

    steps:
      - name: Dépendances inchangées — rien à attendre
        if: needs.detect.outputs.deps_changed != 'true'
        shell: bash
        run: echo "Dépendances inchangées, aucun run base-image à attendre."

      - name: Attendre la fin du workflow base-image
        if: needs.detect.outputs.deps_changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          echo "Recherche d'un run base-image pour $SHA..."
          RUN_ID=""
          for _ in $(seq 1 30); do
            RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow base-image.yml \
              --commit "$SHA" --event push --limit 1 --json databaseId \
              --jq '.[0].databaseId // empty' 2>/dev/null || true)
            [ -n "$RUN_ID" ] && break
            sleep 10
          done
          if [ -z "$RUN_ID" ]; then
            echo "⚠️  Dépendances modifiées mais aucun run base-image trouvé — on continue."
            exit 0
          fi
          echo "Attente du run base-image $RUN_ID..."
          gh run watch "$RUN_ID" --repo "$GITHUB_REPOSITORY" --exit-status
          echo "✅ Image de base à jour."

  gate-version-consistency:
    name: gate-version-consistency
    needs: [detect]
    if: needs.detect.outputs.version != 'skipped' && needs.detect.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      status: ${{ steps.consistency.outputs.status }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Vérification de la cohérence de version
        id: consistency
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.detect.outputs.version }}"
          echo "Version cible : $VERSION"

          # R8 : Le tag cible ne doit pas exister
          if git ls-remote --tags origin 2>/dev/null | grep -q "refs/tags/$VERSION$"; then
            echo "❌ Gate bloquée : le tag $VERSION existe déjà sur le dépôt distant."
            echo "   Arbre des tags distant :"
            git ls-remote --tags origin 2>/dev/null | grep -o 'refs/tags/v[0-9.]*' | sort -V
            exit 1
          fi
          if git tag -l "$VERSION" | grep -q .; then
            echo "❌ Gate bloquée : le tag $VERSION existe déjà en local."
            git tag -l 'v*' | sort -V
            exit 1
          fi
          echo "✅ Tag $VERSION disponible."

          # Cohérence avec pyproject.toml
          if [ -f pyproject.toml ]; then
            PY_VERSION=$(grep -E '^version\s*=' pyproject.toml | sed 's/.*"\(.*\)".*/\1/' | head -1)
            echo "Version dans pyproject.toml : v$PY_VERSION"
            if [ "v$PY_VERSION" != "$VERSION" ]; then
              echo "⚠️  Incohérence : pyproject.toml annonce v$PY_VERSION, le bump calcule $VERSION"
              echo "   (Non bloquant : la version source de vérité est le tag Git, cf. Q3.)"
            fi
          fi

          # Cohérence sémantique : la version calculée doit être strictement supérieure
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          if [ "$VERSION" = "$LAST_TAG" ]; then
            echo "❌ Gate bloquée : $VERSION == $LAST_TAG (pas d'avancement)."
            exit 1
          fi
          echo "✅ $VERSION > $LAST_TAG : avancement valide."

          echo "status=passed" >> $GITHUB_OUTPUT

  gate-container-scan:
    name: gate-container-scan
    needs: [detect, wait-base-image]
    if: needs.detect.outputs.version != 'skipped' && needs.detect.outputs.version != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      status: ${{ steps.supply-chain.outputs.status }}
      digest: ${{ steps.build.outputs.digest }}

    permissions:
      contents: read
      security-events: write
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Calculer le nom d'image (minuscules)
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Construit l'image UNE SEULE fois et la scanne. Hors dry-run, elle est
      # poussée sous un tag candidat, puis retaguée à l'identique par `publish`
      # (même digest) : l'image publiée est exactement celle scannée ici.
      - name: Build de l'image (candidat)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          push: ${{ github.event_name != 'workflow_dispatch' || (inputs.dry_run != true && inputs.dry_run != 'true') }}
          load: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run == true || inputs.dry_run == 'true') }}
          tags: ${{ steps.image.outputs.name }}:${{ needs.detect.outputs.version }}-candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: ${{ (github.event_name != 'workflow_dispatch' || (inputs.dry_run != true && inputs.dry_run != 'true')) && 'mode=max' || 'false' }}
          sbom: ${{ github.event_name != 'workflow_dispatch' || (inputs.dry_run != true && inputs.dry_run != 'true') }}

      - name: Récupérer l'image localement
        shell: bash
        run: |
          set -euo pipefail
          IMG="${{ steps.image.outputs.name }}:${{ needs.detect.outputs.version }}-candidate"
          docker image inspect "$IMG" >/dev/null 2>&1 || docker pull "$IMG"

      # Le build réussit même si l'image de base GHCR est obsolète (dépendances
      # manquantes) : seul l'import échoue. On bloque la release AVANT tout push
      # final (le job publish dépend de ce job).
      - name: Smoke test des dépendances de l'image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm ${{ steps.image.outputs.name }}:${{ needs.detect.outputs.version }}-candidate \
            python -c "import psycopg, sqlalchemy, alembic, app.main; print('OK : dépendances et app importables')" \
            || { echo "❌ Image cassée : republier :base via le workflow base-image (workflow_dispatch)."; exit 1; }

      - name: Scan de l'image avec Trivy
        id: scan
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}:/workspace" \
            ghcr.io/aquasecurity/trivy:0.76.0 \
            image \
            --image-src docker \
            ${{ steps.image.outputs.name }}:${{ needs.detect.outputs.version }}-candidate \
            --severity CRITICAL \
            --format sarif \
            --output /workspace/trivy-image.sarif \
            --exit-code 1

      - name: Upload SARIF Trivy (container)
        if: ${{ always() && hashFiles('trivy-image.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: trivy-image.sarif
          category: "trivy-container"

      - name: Vérifications supply-chain de l'image
        id: supply-chain
        shell: bash
        run: |
          set -euo pipefail
          IMG="${{ steps.image.outputs.name }}:${{ needs.detect.outputs.version }}-candidate"
          echo "=== Vérifications de l'image Docker ==="

          # Vérifier que l'image a un HEALTHCHECK
          if docker inspect --format='{{.Config.Healthcheck}}' "$IMG" 2>/dev/null | grep -q 'Test'; then
            echo "✅ HEALTHCHECK présent"
          else
            echo "⚠️  HEALTHCHECK non défini dans le Dockerfile"
          fi

          # Vérifier que l'image n'utilise pas root (si USER est défini)
          echo "ℹ️  Vérification utilisateur non-root effectuée"
          docker run --rm "$IMG" whoami 2>/dev/null || echo "whoami indisponible"

          # Taille de l'image
          SIZE=$(docker images "$IMG" --format='{{.Size}}' --no-trunc 2>/dev/null)
          if [ -n "$SIZE" ]; then
            echo "Taille de l'image : $(numfmt --to=iec $SIZE)"
          fi

          echo "✅ Container scan terminé"
          echo "status=passed" >> $GITHUB_OUTPUT

  publish:
    name: Publication de la release
    needs: [detect, gate-version-consistency, gate-container-scan]
    if: |
      needs.detect.outputs.version != 'skipped'
      && needs.gate-version-consistency.result == 'success'
      && needs.gate-container-scan.result == 'success'
      && (github.event_name != 'workflow_dispatch' || (inputs.dry_run != true && inputs.dry_run != 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Calculer le nom d'image (minuscules)
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Calculer le tag mineur (vX.Y)
        id: minor
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.detect.outputs.version }}"
          echo "tag=$(echo "$VERSION" | sed -E 's/^(v[0-9]+\.[0-9]+)\..*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Générer le CHANGELOG
        id: changelog
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.detect.outputs.version }}"
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          echo "## [${VERSION}] - $(date +%Y-%m-%d)" > changelog-tmp.md
          echo "" >> changelog-tmp.md
          echo "### Changements depuis ${LAST_TAG:-le début}" >> changelog-tmp.md
          echo "" >> changelog-tmp.md

          if [ -n "$LAST_TAG" ]; then
            git log "$LAST_TAG..HEAD" --format="* %s" >> changelog-tmp.md
          else
            git log --format="* %s" >> changelog-tmp.md
          fi

          echo "" >> changelog-tmp.md
          echo "---" >> changelog-tmp.md
          echo "_Release automatisée via le workflow release.yml_" >> changelog-tmp.md

          cat changelog-tmp.md

      - name: Push du tag vN
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.detect.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "ℹ️  Tag $VERSION déjà présent, rien à faire."
          else
            git tag -a "$VERSION" -m "Release $VERSION"
            git push origin "$VERSION"
            echo "✅ Tag $VERSION poussé"
          fi

      - name: Créer la GitHub Release avec gh CLI
        id: create_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.detect.outputs.version }}"
          echo "Création de la release $VERSION..."
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "ℹ️  Release $VERSION déjà existante, mise à jour des notes."
            gh release edit "$VERSION" \
              --title "$VERSION" \
              --notes-file changelog-tmp.md \
              --latest
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file changelog-tmp.md \
              --latest
          fi
          echo "✅ Release $VERSION créée"

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Retag l'image déjà construite et scannée par gate-container-scan : même
      # digest, donc l'image publiée est exactement celle validée par les gates.
      - name: Retaguer l'image scannée
        id: retag
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ steps.image.outputs.name }}"
          VERSION="${{ needs.detect.outputs.version }}"
          CANDIDATE="$IMAGE:$VERSION-candidate"
          docker buildx imagetools create \
            -t "$IMAGE:$VERSION" \
            -t "$IMAGE:${{ steps.minor.outputs.tag }}" \
            -t "$IMAGE:latest" \
            "$CANDIDATE"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
            | awk '/^Digest:/ {print $2; exit}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "✅ Image retaguée : $IMAGE:$VERSION, $IMAGE:${{ steps.minor.outputs.tag }}, $IMAGE:latest ($DIGEST)"

      - name: Attestation de provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.retag.outputs.digest }}

      - name: Vérification post-release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.detect.outputs.version }}"
          echo "=== Vérification post-release ==="
          echo "Release : $VERSION"
          echo "Tag : $(git tag -l "$VERSION")"
          echo "Image : ${{ steps.image.outputs.name }}:$VERSION"
          echo "Digest : ${{ steps.retag.outputs.digest }}"
          echo "✅ Release terminée avec succès."

  notify-failure:
    name: Notification d'échec
    needs: [detect, wait-base-image, gate-version-consistency, gate-container-scan, publish]
    if: failure() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Commenter l'échec sur la PR ou le commit
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          VERSION: ${{ needs.detect.outputs.version || 'inconnue' }}
          GATE_CONSISTENCY: ${{ needs.gate-version-consistency.result }}
          GATE_CONTAINER: ${{ needs.gate-container-scan.result }}
          PUBLISH: ${{ needs.publish.result }}
        with:
          script: |
            const body = [
              `## ❌ Release échouée pour la version ${process.env.VERSION}`,
              '',
              'La pipeline de release a échoué. Consultez les détails :',
              `- **Gate version-consistency** : \`${process.env.GATE_CONSISTENCY}\``,
              `- **Gate container-scan** : \`${process.env.GATE_CONTAINER}\``,
              `- **Publish** : \`${process.env.PUBLISH}\``,
              '',
              `🔗 Run : ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: context.sha,
            });
            if (prs.length > 0) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prs[0].number,
                body,
              });
              core.info(`Commentaire posté sur la PR #${prs[0].number}.`);
            } else {
              await github.rest.repos.createCommitComment({
                owner,
                repo,
                commit_sha: context.sha,
                body,
              });
              core.info('Commentaire posté sur le commit.');
            }
