# Workflow : Image de base (dépendances précompilées)
# Publie ghcr.io/<repo>-base:latest, consommée par le Dockerfile applicatif.
# Se déclenche quand les dépendances changent (ou manuellement).
name: base-image

on:
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile.base"
  workflow_dispatch:

concurrency:
  group: base-image-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-base:
    name: Build & push image de base
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Calculer le nom d'image (minuscules)
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build & push de l'image de base
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.base
          push: true
          tags: ${{ steps.image.outputs.name }}:base
          cache-from: type=gha,scope=base
          cache-to: type=gha,mode=max,scope=base
