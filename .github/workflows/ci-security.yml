# Workflow : Sécurité
# Analyse SCA, SAST, secret leak, IaC/Dockerfile scan, et commentaire de synthèse
name: ci-security

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  sca:
    name: SCA (Dependency Review)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      security-events: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-scopes: "runtime"
          fail-on-severity: "high"
          # "PSF" n'est pas une licence SPDX valide pour dependency-review :
          # on garde "Python-2.0" (PSF) et on retire "PSF".
          # torch : expression SPDX composée (Apache-2.0 AND Apache-2.0 WITH
          # LLVM-exception AND BSD-2-Clause AND BSD-3-Clause AND BSL-1.0 AND MIT)
          # -> chaque composant doit figurer dans l'allow-list.
          # LGPL-3.0-only : composant de psycopg (intégration PostgreSQL).
          allow-licenses: "MIT, Apache-2.0, Apache-2.0 WITH LLVM-exception, BSD-3-Clause, BSD-2-Clause, ISC, Unlicense, 0BSD, MPL-2.0, CC0-1.0, CC-BY-4.0, Python-2.0, Unicode-3.0, BSL-1.0, LGPL-3.0-only"

      - name: Valider le registre des exceptions de sécurité
        shell: bash
        run: |
          set -euo pipefail
          # Registre daté : une exception expirée fait échouer la CI.
          # PyYAML épinglé, installé dans un venv jetable (pas de paquet système).
          python3 -m venv "$RUNNER_TEMP/exc-venv"
          "$RUNNER_TEMP/exc-venv/bin/pip" install --quiet --disable-pip-version-check 'pyyaml==6.0.2'
          "$RUNNER_TEMP/exc-venv/bin/python" scripts/check_security_exceptions.py

      - name: Scan des dépendances avec Trivy (système)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          # Script et binaire épinglés à la même version (v0.76.0).
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.76.0/contrib/install.sh | sh -s -- -b /usr/local/bin v0.76.0
          trivy fs "${GITHUB_WORKSPACE}" \
            --severity HIGH,CRITICAL \
            --skip-dirs "${GITHUB_WORKSPACE}/.venv" \
            --format sarif \
            --output "${GITHUB_WORKSPACE}/trivy-fs.sarif" \
            --exit-code 1

      - name: Upload SARIF Trivy
        if: ${{ always() && hashFiles('trivy-fs.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: trivy-fs.sarif
          category: "trivy-fs"

  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          languages: "python"
          queries: security-and-quality

      - name: Autobuild CodeQL
        uses: github/codeql-action/autobuild@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4

      - name: Analyse CodeQL (upload automatique)
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: "/language:python"

  secret-leak:
    name: Secret Leak (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan Gitleaks (historique de la PR)
        id: gitleaks
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Binaire officiel Gitleaks épinglé (évite une image Docker refusée).
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          GITLEAKS="$(go env GOPATH)/bin/gitleaks"
          # Scan de la plage de commits de la PR (un secret ajouté puis supprimé
          # dans la PR reste détecté) ; hors PR, scan de l'arbre/historique.
          LOG_OPTS=()
          if [ -n "${BASE_SHA:-}" ] && [ -n "${HEAD_SHA:-}" ]; then
            LOG_OPTS=(--log-opts="${BASE_SHA}..${HEAD_SHA}")
          fi
          EXIT_CODE=0
          "$GITLEAKS" detect \
            --source "${{ github.workspace }}" \
            --config "${{ github.workspace }}/.gitleaks.toml" \
            --report-format sarif \
            --report-path "${{ github.workspace }}/gitleaks.sarif" \
            --redact \
            --verbose \
            "${LOG_OPTS[@]}" \
            --exit-code 1 || EXIT_CODE=$?
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF Gitleaks
        if: ${{ always() && steps.gitleaks.outputs.exit_code != '0' && hashFiles('gitleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: gitleaks.sarif
          category: "gitleaks"

      - name: Vérification de .gitignore / .dockerignore
        shell: bash
        run: |
          set -euo pipefail
          for f in .gitignore .dockerignore; do
            if [ -f "$f" ]; then
              echo "✅ $f présent"
              for pattern in '.env' '*.key' '*.pem' 'credentials' 'secrets' 'token'; do
                if grep -qE "^${pattern}$|^${pattern}/" "$f" 2>/dev/null; then
                  echo "   ✓ $pattern couvert par $f"
                fi
              done
            else
              echo "⚠️  $f absent"
            fi
          done

      - name: Échouer si une fuite de secret est détectée
        if: always() && steps.gitleaks.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "❌ Gitleaks a détecté au moins une fuite de secret."
          echo "   Voir le rapport SARIF (catégorie « gitleaks »)."
          exit 1

  iac-scan:
    name: IaC / Dockerfile Scan (Trivy config)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Scan IaC avec Trivy
        shell: bash
        run: |
          set -euo pipefail
          # Script et binaire épinglés à la même version (v0.76.0).
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/v0.76.0/contrib/install.sh | sh -s -- -b /usr/local/bin v0.76.0
          trivy config "${{ github.workspace }}" \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output "${{ github.workspace }}/trivy-iac.sarif" \
            --exit-code 1

      - name: Upload SARIF IaC
        if: always()
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: trivy-iac.sarif
          category: "trivy-iac"

  summary:
    name: Synthèse de sécurité
    runs-on: ubuntu-latest
    needs: [sca, sast, secret-leak, iac-scan]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Analyser les résultats des jobs
        id: results
        shell: bash
        run: |
          set -euo pipefail
          SCA_STATUS="${{ needs.sca.result }}"
          SAST_STATUS="${{ needs.sast.result }}"
          SECRET_STATUS="${{ needs.secret-leak.result }}"
          IAC_STATUS="${{ needs.iac-scan.result }}"

          echo "### 🔒 Synthèse sécurité" > summary.md
          echo "" >> summary.md
          echo "| Scan | Statut |" >> summary.md
          echo "|------|--------|" >> summary.md
          echo "| SCA (Dependency Review + Trivy) | $SCA_STATUS |" >> summary.md
          echo "| SAST (CodeQL) | $SAST_STATUS |" >> summary.md
          echo "| Secret Leak (Gitleaks) | $SECRET_STATUS |" >> summary.md
          echo "| IaC / Dockerfile (Trivy) | $IAC_STATUS |" >> summary.md
          echo "" >> summary.md

          if [[ "$SCA_STATUS" == "success" && "$SAST_STATUS" == "success" && "$SECRET_STATUS" == "success" && "$IAC_STATUS" == "success" ]]; then
            echo "✅ **Verdict global : PASS** — tous les scans sont conformes." >> summary.md
          else
            echo "❌ **Verdict global : ÉCHEC** — un ou plusieurs scans ont échoué." >> summary.md
            echo "" >> summary.md
            echo "Consultez les détails dans les onglets ci-dessus ou les artefacts SARIF." >> summary.md
          fi
          cat summary.md

      - name: Publier le commentaire de synthèse
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('summary.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.body.includes('🔒 Synthèse sécurité') && c.user.type === 'Bot'
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }
