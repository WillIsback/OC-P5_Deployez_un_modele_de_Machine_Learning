# Workflow : Sécurité
# Analyse SCA, SAST, secret leak, IaC/Dockerfile scan, et commentaire de synthèse
name: ci-security

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  sca:
    name: SCA (Dependency Review)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      security-events: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-scopes: "runtime"
          fail-on-severity: "high"
          allow-licenses: "MIT, Apache-2.0, BSD-3-Clause, BSD-2-Clause, ISC, Unlicense, 0BSD, MPL-2.0, CC0-1.0, CC-BY-4.0, Python-2.0, PSF, Unicode-3.0"

      - name: Scan des dépendances avec Trivy (système)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            ghcr.io/aquasecurity/trivy:latest \
            fs /workspace \
            --severity HIGH,CRITICAL \
            --skip-dirs /workspace/.venv \
            --format sarif \
            --output /workspace/trivy-fs.sarif \
            --exit-code 1

      - name: Upload SARIF Trivy
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: "trivy-fs"

  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: "python"
          queries: security-and-quality

      - name: Autobuild CodeQL
        uses: github/codeql-action/autobuild@v3

      - name: Analyse CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"
          output: sarif-results
          upload: "False"

      - name: Upload SARIF CodeQL
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results
          category: "codeql-python"

  secret-leak:
    name: Secret Leak (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Gitleaks (range de la PR)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            ghcr.io/gitleaks/gitleaks:latest \
            detect \
            --source /workspace \
            --config /workspace/.gitleaks.toml \
            --report-format sarif \
            --report-path /workspace/gitleaks.sarif \
            --verbose \
            --no-git \
            --exit-code 1 || EXIT_CODE=$?
          if [ "${EXIT_CODE:-0}" -ne 0 ] && [ -f "${{ github.workspace }}/gitleaks.sarif" ]; then
            echo "🔍 Fuite(s) détectée(s). Voir le rapport SARIF."
          fi

      - name: Upload SARIF Gitleaks
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: "gitleaks"

      - name: Vérification de .gitignore / .dockerignore
        shell: bash
        run: |
          set -euo pipefail
          for f in .gitignore .dockerignore; do
            if [ -f "$f" ]; then
              echo "✅ $f présent"
              for pattern in '.env' '*.key' '*.pem' 'credentials' 'secrets' 'token'; do
                if grep -qE "^${pattern}$|^${pattern}/" "$f" 2>/dev/null; then
                  echo "   ✓ $pattern couvert par $f"
                fi
              done
            else
              echo "⚠️  $f absent"
            fi
          done

  iac-scan:
    name: IaC / Dockerfile Scan (Trivy config)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Scan IaC avec Trivy
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            ghcr.io/aquasecurity/trivy:latest \
            config /workspace \
            --severity HIGH,CRITICAL \
            --format sarif \
            --output /workspace/trivy-iac.sarif \
            --exit-code 1

      - name: Upload SARIF IaC
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac.sarif
          category: "trivy-iac"

  summary:
    name: Synthèse de sécurité
    runs-on: ubuntu-latest
    needs: [sca, sast, secret-leak, iac-scan]
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Analyser les résultats des jobs
        id: results
        shell: bash
        run: |
          set -euo pipefail
          SCA_STATUS="${{ needs.sca.result }}"
          SAST_STATUS="${{ needs.sast.result }}"
          SECRET_STATUS="${{ needs.secret-leak.result }}"
          IAC_STATUS="${{ needs.iac-scan.result }}"

          echo "### 🔒 Synthèse sécurité" > summary.md
          echo "" >> summary.md
          echo "| Scan | Statut |" >> summary.md
          echo "|------|--------|" >> summary.md
          echo "| SCA (Dependency Review + Trivy) | $SCA_STATUS |" >> summary.md
          echo "| SAST (CodeQL) | $SAST_STATUS |" >> summary.md
          echo "| Secret Leak (Gitleaks) | $SECRET_STATUS |" >> summary.md
          echo "| IaC / Dockerfile (Trivy) | $IAC_STATUS |" >> summary.md
          echo "" >> summary.md

          if [[ "$SCA_STATUS" == "success" && "$SAST_STATUS" == "success" && "$SECRET_STATUS" == "success" && "$IAC_STATUS" == "success" ]]; then
            echo "✅ **Verdict global : PASS** — tous les scans sont conformes." >> summary.md
          else
            echo "❌ **Verdict global : ÉCHEC** — un ou plusieurs scans ont échoué." >> summary.md
            echo "" >> summary.md
            echo "Consultez les détails dans les onglets ci-dessus ou les artefacts SARIF." >> summary.md
          fi
          cat summary.md

      - name: Publier le commentaire de synthèse
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('summary.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.body.includes('🔒 Synthèse sécurité') && c.user.type === 'Bot'
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }