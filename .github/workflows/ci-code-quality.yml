# Workflow : Qualité du code
# Vérifie le formatage, le lint, la cohérence des commits et des manifests
name: ci-code-quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  ci-code-quality:
    name: ci-code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      actions: read
      security-events: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Installer uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.13.1"
          cache-dependency-glob: "uv.lock"

      - name: Synchroniser les dépendances
        run: |
          set -euo pipefail
          uv sync --frozen --no-cache --no-install-project

      - name: Linter (ruff check)
        run: |
          set -euo pipefail
          .venv/bin/ruff check --output-format github .

      - name: Formateur (ruff format --check)
        run: |
          set -euo pipefail
          .venv/bin/ruff format --check --diff .

      - name: Lint du titre de PR (commitlint / validation)
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          PATTERN='^(feat|fix|refactor|docs|test|chore|perf|ci|build|revert)(\(.+\))?!?: .+'
          if ! echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "❌ Le titre de la PR ne respecte pas Conventional Commits."
            echo "   Titre : $PR_TITLE"
            echo "   Pattern attendu : $PATTERN"
            echo "   Exemples valides : feat: ..., fix(scope): ..., feat!: ..., chore: ..."
            exit 1
          fi
          echo "✅ Titre de PR valide."

      - name: Lint des Dockerfiles (hadolint)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
          format: json

      - name: Lint des workflows GitHub (actionlint)
        shell: bash
        run: |
          set -euo pipefail
          # Script et binaire épinglés à la même version (v1.7.12).
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          # -shellcheck=- : désactive l'intégration shellcheck (codes de style
          # pré-existants dans release.yml) tout en gardant le lint structurel.
          ./actionlint -color -shellcheck=-

      - name: Analyse de sécurité des workflows (zizmor)
        id: zizmor
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # zizmor audite réellement les workflows (injections de template,
          # permissions excessives, actions non épinglées…). Bloquant à partir
          # de la sévérité « high » ; les constats « dangerous-triggers »
          # justifiés sont listés dans .github/zizmor.yml.
          uvx zizmor@1.31.0 --min-severity high --format sarif .github/workflows > zizmor.sarif

      - name: Upload SARIF zizmor
        if: ${{ always() && hashFiles('zizmor.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: zizmor.sarif
          category: "zizmor"

      - name: Échouer si zizmor signale un problème de sévérité élevée
        if: steps.zizmor.outcome == 'failure'
        shell: bash
        run: |
          echo "❌ zizmor a signalé au moins un problème de sévérité « high »."
          exit 1

      - name: Vérification de l'intégrité du lockfile
        run: |
          set -euo pipefail
          uv lock --check
          echo "✅ Lockfile valide."

      - name: Vérification des manifests (pyproject.toml)
        shell: python
        run: |
          import tomllib, sys
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          assert 'project' in data, 'pyproject.toml: section [project] manquante'
          assert 'dependencies' in data['project'], 'pyproject.toml: dependencies manquantes'
          print('✅ pyproject.toml valide.')