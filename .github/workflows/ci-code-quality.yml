# Workflow : Qualité du code
# Vérifie le formatage, le lint, la cohérence des commits et des manifests
name: ci-code-quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: code-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  ci-code-quality:
    name: ci-code-quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "latest"
          cache-dependency-glob: "uv.lock"

      - name: Synchroniser les dépendances
        run: |
          set -euo pipefail
          uv sync --frozen --no-cache --no-install-project

      - name: Linter (ruff check)
        run: |
          set -euo pipefail
          .venv/bin/ruff check --output-format github .

      - name: Formateur (ruff format --check)
        run: |
          set -euo pipefail
          .venv/bin/ruff format --check --diff .

      - name: Lint du titre de PR (commitlint / validation)
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          PATTERN='^(feat|fix|refactor|docs|test|chore|perf|ci|build|revert)(\(.+\))?!?: .+'
          if ! echo "$PR_TITLE" | grep -qE "$PATTERN"; then
            echo "❌ Le titre de la PR ne respecte pas Conventional Commits."
            echo "   Titre : $PR_TITLE"
            echo "   Pattern attendu : $PATTERN"
            echo "   Exemples valides : feat: ..., fix(scope): ..., feat!: ..., chore: ..."
            exit 1
          fi
          echo "✅ Titre de PR valide."

      - name: Lint des Dockerfiles (hadolint)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error
          format: json

      - name: Lint des workflows GitHub (actionlint)
        shell: bash
        run: |
          set -euo pipefail
          # Binaire officiel actionlint (script de download du repo rhysd/actionlint)
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          # -shellcheck=- : désactive l'intégration shellcheck (codes de style
          # pré-existants dans release.yml) tout en gardant le lint structurel.
          ./actionlint -color -shellcheck=-

      - name: Analyse de sécurité des workflows (zizmor)
        uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3
        continue-on-error: true
        with:
          src: ".github/workflows/"
          args: check --output-format github --ignore E999 --select S

      - name: Vérification de l'intégrité du lockfile
        run: |
          set -euo pipefail
          uv lock --check
          echo "✅ Lockfile valide."

      - name: Vérification des manifests (pyproject.toml)
        shell: python
        run: |
          import tomllib, sys
          with open('pyproject.toml', 'rb') as f:
              data = tomllib.load(f)
          assert 'project' in data, 'pyproject.toml: section [project] manquante'
          assert 'dependencies' in data['project'], 'pyproject.toml: dependencies manquantes'
          print('✅ pyproject.toml valide.')