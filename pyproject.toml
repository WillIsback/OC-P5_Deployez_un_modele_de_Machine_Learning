[project]
name = "P5_Deployez_un_modele_de_Machine_Learning"
version = "0.0.1"
description = "Cette mission suit un scénario de projet professionnel. Déployer un modèle de machine learning à l’aide d’outils modernes."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "catboost>=1.2.10",
    "fastapi[standard]>=0.143.0",
    "mlflow>=3.17.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pwdlib[argon2]>=0.3.1",
    "pyjwt>=2.15.1",
    "python-dotenv>=1.2.4",
    "ruff>=0.16.10",
    "scikit-learn>=1.9.1",
    "sqlmodel>=0.0.48",
    "structured-data-models",
    "torch",
]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
    "pytest>=9.1.1",
    "diff-cover>=10.6.0",
]

[tool.coverage.run]
# Scaffolding pré-existant non utilisé par l'application FastAPI
omit = [
    "app/core/database_service.py",
    "app/schemas/database.py",
    "app/internal/*",
]

[tool.uv.sources]
structured-data-models = { git = "https://github.com/NVIDIA/structured-data-models.git" }
# Serving CPU-only : éviter les wheels CUDA + paquets nvidia-* (image bien plus légère)
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
