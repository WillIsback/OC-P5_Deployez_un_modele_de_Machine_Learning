# Configuration Gitleaks
# docs: https://github.com/gitleaks/gitleaks#configuration
title = "Gitleaks config"

[[rules]]
id = "aws-access-token"
description = "AWS Access Token"
regex = '''(?i)AKIA[0-9A-Z]{16}'''
secretGroup = 0

[[rules]]
id = "aws-secret-key"
description = "AWS Secret Key"
regex = '''(?i)aws(.{0,20})?(?-i)['"][0-9a-zA-Z/+]{40}['"]'''
secretGroup = 0

[[rules]]
id = "github-token"
description = "GitHub Token"
regex = '''(?i)gh[pousr]_[0-9a-zA-Z_]{36,}'''
secretGroup = 0

[[rules]]
id = "gitlab-token"
description = "GitLab Token"
regex = '''glpat-[0-9a-zA-Z\-_]{20,}'''
secretGroup = 0

[[rules]]
id = "slack-token"
description = "Slack Token"
regex = '''xox[baprs]-[0-9a-zA-Z]{10,}'''
secretGroup = 0

[[rules]]
id = "private-key"
description = "Private Key"
regex = '''(?i)-----BEGIN\s?[A-Z\s]+?PRIVATE\s?KEY-----'''
secretGroup = 0

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(api[_-]?key|apikey|api[_-]?secret|api[_-]?token)(.{0,20})['"][0-9a-zA-Z_\-]{16,}['"]'''
secretGroup = 0

# Chemins à ignorer (expressions régulières Go).
[allowlist]
description = "Chemins ignorés"
paths = [
  '''(?i)\.lock$''',
  '''(?i)\.(?:svg|png|jpe?g|gif|pyc)$''',
  '''(?:^|/)node_modules/''',
  '''(?:^|/)\.venv/''',
  '''(?:^|/)vendor/''',
  '''(?:^|/)__pycache__/''',
  '''gitleaks\.toml$''',
]
