services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Image publiée sur GHCR (modèle livré inclus). Depuis un clone, le fichier
  # docker-compose.override.yml (chargé automatiquement) la remplace par un build
  # local et monte ./models. P5_IMAGE épingle une version : `…:v1.3.2`.
  api:
    image: ${P5_IMAGE:-ghcr.io/willisback/oc-p5_deployez_un_modele_de_machine_learning:latest}
    environment:
      SECRET_KEY: ${SECRET_KEY:?définir SECRET_KEY dans .env}
      DATABASE_URL: postgresql+psycopg://p5_api:${P5_API_PASSWORD:?définir P5_API_PASSWORD dans .env}@db:5432/p5
      KUMO_CONTEXT_SIZE: ${KUMO_CONTEXT_SIZE:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"

  # Outillage (non démarré par `up`) : provisionnement, ingestion, préparation,
  # évaluation, entraînement. Seul ce service reçoit les identifiants
  # admin/propriétaire (jamais le service `api`).
  tools:
    image: ${P5_IMAGE:-ghcr.io/willisback/oc-p5_deployez_un_modele_de_machine_learning:latest}
    profiles: ["tools"]
    # Uid/gid de l'hôte pour écrire dans ./data, ./models et ./mlruns (montages liés).
    # Si `id -u` / `id -g` ne valent pas 1000, définir UID et GID dans .env.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      SECRET_KEY: ${SECRET_KEY:?définir SECRET_KEY dans .env}
      DATABASE_ADMIN_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD dans .env}@db:5432/postgres
      DATABASE_OWNER_URL: postgresql+psycopg://p5_owner:${P5_OWNER_PASSWORD:?définir P5_OWNER_PASSWORD dans .env}@db:5432/p5
      MLFLOW_TRACKING_URI: postgresql+psycopg://p5_mlflow:${P5_MLFLOW_PASSWORD:?définir P5_MLFLOW_PASSWORD dans .env}@db:5432/mlflow
      P5_OWNER_PASSWORD: ${P5_OWNER_PASSWORD:?définir P5_OWNER_PASSWORD dans .env}
      P5_API_PASSWORD: ${P5_API_PASSWORD:?définir P5_API_PASSWORD dans .env}
      P5_MLFLOW_PASSWORD: ${P5_MLFLOW_PASSWORD:?définir P5_MLFLOW_PASSWORD dans .env}
      P5_GRAFANA_PASSWORD: ${P5_GRAFANA_PASSWORD:?définir P5_GRAFANA_PASSWORD dans .env}
      TRAINING_YEAR: ${TRAINING_YEAR:-2016}
      # L'uid de l'hôte n'existe pas dans l'image : sans HOME inscriptible, ~/.cache
      # vaut /.cache et l'évaluation Kumo échoue (repli silencieux sur CatBoost).
      HOME: /tmp
      # Comptes de démo (johndoe/secret) créés par create_db si 1 : jamais en production.
      P5_SEED_DEMO_USERS: ${P5_SEED_DEMO_USERS:-0}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Inscriptible : `app.db.ingest --download` peut y télécharger les CSV.
      - ./data:/app/data
      # Artefacts MLflow (les métadonnées sont dans la base `mlflow`).
      - ./mlruns:/app/mlruns
    # Journaux d'entraînement CatBoost (catboost_info/ dans le dossier courant,
    # /app n'est pas inscriptible par l'uid de l'hôte) : jetables.
    tmpfs:
      - /app/catboost_info

  # Monitoring : tableaux de bord « API » et « Modèle » lus dans la base avec le
  # rôle p5_grafana (lecture seule). Sans état : datasource et tableaux de bord
  # viennent de ./grafana/provisioning (versionné). Connexion admin obligatoire.
  grafana:
    image: grafana/grafana-oss:12.4.3
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?définir GRAFANA_ADMIN_PASSWORD dans .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/api.json
      # Lu par grafana/provisioning/datasources/postgres.yml.
      P5_GRAFANA_PASSWORD: ${P5_GRAFANA_PASSWORD:?définir P5_GRAFANA_PASSWORD dans .env}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Interface de démonstration (Gradio) : même image que l'API, cliente HTTP de
  # celle-ci (aucun accès à la base ni au modèle, ni SECRET_KEY) ; chaque action
  # passe par le JWT et la traçabilité, donc visible dans Grafana.
  ui:
    image: ${P5_IMAGE:-ghcr.io/willisback/oc-p5_deployez_un_modele_de_machine_learning:latest}
    command: ["python", "-m", "app.ui"]
    environment:
      P5_API_URL: http://api:8080
      # Écoute sur toutes les interfaces du conteneur (hors Docker : 127.0.0.1).
      GRADIO_SERVER_NAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${UI_PORT:-7860}:7860"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7860/')"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
